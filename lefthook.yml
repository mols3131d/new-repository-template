# Git hooks are opt-in: inspect existing hooks/core.hooksPath before 'lefthook install'.
# Other hooks check only; the Inbox Markdown hook formats and re-stages its staged files.
no_tty: true

pre-commit:
  commands:
    markdown:
      glob: "*.md"
      exclude:
        - ".inbox/*.md"
        - ".inbox/**/*.md"
      run: mise exec -- rumdl check {staged_files}
    inbox-markdown:
      glob:
        - ".inbox/*.md"
        - ".inbox/**/*.md"
      run: mise exec -- rumdl fmt {staged_files} && mise exec -- rumdl check {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{json,jsonc,js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: mise exec -- biome check {staged_files}
