name: Validate documentation index

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/generate-docs-index.ts"
      - "tests/scripts/generate-docs-index.test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.scripts.json"
      - "scripts/README.md"
      - ".github/templates/README.md"
      - ".github/workflows/docs-index.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate-docs-index.ts"
      - "tests/scripts/generate-docs-index.test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.scripts.json"
      - "scripts/README.md"
      - ".github/templates/README.md"
      - ".github/workflows/docs-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: docs-index-validate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repairable: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Validate the same revision that the repair job can commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:docs
      - run: npm run docs:frontmatter:check
      - name: Check documentation index
        id: index_check
        continue-on-error: true
        run: npm run docs:index:check
      - name: Fail when automatic repair is unavailable
        if: >-
          ${{ steps.index_check.outcome == 'failure' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          echo "::error::Index validation failed; automatic repair is only supported on same-repository PRs."
          exit 1
      - name: Prepare regenerated index
        id: prepare
        if: >-
          ${{ steps.index_check.outcome == 'failure' &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          npm run docs:index
          npm run docs:index:check
          if git diff --quiet -- docs/INDEX.tsv && git ls-files --error-unmatch docs/INDEX.tsv >/dev/null 2>&1; then
            echo "::error::Index check failed without a changed generated index."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        with:
          name: regenerated-docs-index
          path: docs/INDEX.tsv
          if-no-files-found: error
          retention-days: 1

  commit-index:
    needs: validate
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.validate.outputs.repairable == 'true' }}
    concurrency:
      group: docs-index-write-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: regenerated-docs-index
          path: regenerated
      - name: Commit the index to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cp -- regenerated/INDEX.tsv docs/INDEX.tsv
          git add -- docs/INDEX.tsv
          if git diff --cached --quiet; then
            echo "::error::The repaired index did not change the PR."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): regenerate documentation index"
          gh auth setup-git
          # Non-force push rejects a stale PR head rather than overwriting newer work.
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          # GITHUB_TOKEN pushes do not trigger ordinary CI runs.
          gh workflow run docs-index.yml --ref "$PR_BRANCH"
          gh workflow run repo-checks.yml --ref "$PR_BRANCH"
