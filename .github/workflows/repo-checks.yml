name: Repository checks

on:
  pull_request:
    paths-ignore:
      - ".inbox/**"
  push:
    branches: [main]
    paths-ignore:
      - ".inbox/**"
  workflow_dispatch:

concurrency:
  group: repo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: mise exec -- npm ci --ignore-scripts
      - run: mise exec -- npm run typecheck:scripts
      - run: mise run agents-check
      - run: mise exec -- node --test tests/scripts/manage-agent-assets.test.ts
      - run: |
          git ls-files -z '*.md' ':!.inbox/**' | xargs -0 -r mise exec -- rumdl check
          git ls-files -z '*.md' ':!.inbox/**' | xargs -0 -r mise exec -- rumdl fmt --check
      - run: mise exec -- biome check .
      - run: mise exec -- lefthook validate
