name: Feature proposal
description: Propose a bounded improvement and its expected outcome.
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or development problem exists today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should observably change? Separate the result from possible implementation choices.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State conditions that can be checked independently of implementation progress.
      placeholder: |
        - Given [scenario], [observable result]
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and risks
      description: Relevant exclusions, dependencies, compatibility concerns, or permission constraints.
  - type: textarea
    id: references
    attributes:
      label: Starting points and references
      description: Related issues, task records, files, documentation, or known examples.
